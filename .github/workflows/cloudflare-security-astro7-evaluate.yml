name: Cloudflare Astro 7 Security Migration Evaluation (NO DEPLOY)
on:
  push:
    branches: [infra/cloudflare-security-astro7-eval]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-upgrade-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated infrastructure-only branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use controlled Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Ensure no user-facing SEO changes versus actual Vercel baseline
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const base='1d235196f45e29af4c425fa4505111596db8e4c6';
          const changed=execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allow=p=>p==='package.json'||p==='package-lock.json'||p==='wrangler.jsonc'
            ||p==='.node-version'||p==='public/.assetsignore'
            ||p==='astro.config.cloudflare.production.mjs'||p==='src/pages/api/google-reviews.ts'
            ||p.startsWith('scripts/cloudflare-')||p.startsWith('.github/workflows/cloudflare-')
            ||p.startsWith('docs/cloudflare-');
          assert.deepEqual(changed.filter(x=>!allow(x)),[],'Unexpected SEO/content drift!');
          console.log('PASS no SEO page modifications; changed infrastructure files:',changed.length);
          NODE
      - name: Prepare patched dependency lock in runner only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies.astro='7.4.9';
          delete pkg.dependencies['@astrojs/vercel'];
          pkg.devDependencies['@astrojs/vercel']='11.0.21';
          pkg.dependencies['@astrojs/markdown-remark']='7.3.6';
          pkg.devDependencies['@astrojs/cloudflare']='14.4.7';
          pkg.devDependencies.sharp='0.35.5';
          pkg.devDependencies.wrangler='4.125.0';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lockGuard='scripts/cloudflare-lock-verify.mjs';
          let script=fs.readFileSync(lockGuard,'utf8');
          if(!script.includes("'@astrojs/cloudflare': '13.7.0'") && !script.includes("'@astrojs/cloudflare': '14.4.7'"))throw new Error('Unexpected pinned adapter version; manual review required');
          script=script.replace("'@astrojs/cloudflare': '13.7.0'","'@astrojs/cloudflare': '14.4.7'");
          script=script.replace("wrangler: '4.100.0'","wrangler: '4.125.0'");
          fs.writeFileSync(lockGuard,script);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-fund
          npm ls astro @astrojs/cloudflare @astrojs/vercel sharp
          node scripts/cloudflare-lock-verify.mjs
      - name: Produce machine-readable security audit (fail if Critical remains)
        run: |
          mkdir -p artifacts/cloudflare-migration
          npm audit --omit=dev --json > artifacts/cloudflare-migration/security-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('artifacts/cloudflare-migration/security-audit.json','utf8'));
          const v=x.metadata?.vulnerabilities;
          if(!v || typeof v.critical!=='number')throw new Error('npm audit was not valid; NO-GO');
          console.log('Security findings for upgraded dependency graph:',JSON.stringify(v));
          if(v.critical>0 || v.high>0)throw new Error('High/Critical production dependency vulnerability remains; NO-GO');
          NODE
      - name: Verify Google Reviews functionality and build protected SEO release
        run: |
          npm run test:google-reviews
          npx astro build --config astro.config.cloudflare.production.mjs
          npm run validate:seo
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const root='dist/client';
          const xmls=fs.readdirSync(root).filter(f=>/^sitemap-\d+\.xml$/.test(f));
          assert.ok(xmls.length>0,'Missing generated sitemap pages');
          const urls=xmls.flatMap(f=>[...fs.readFileSync(root+'/'+f,'utf8').matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]));
          console.log('PROTECTED_SITEMAP_URL_COUNT',urls.length,'sitemap files',xmls.length);
          assert.equal(urls.length,1189,'Sitemap count changed from current live Vercel baseline');
          assert.equal(new Set(urls).size,1189,'Duplicate sitemap URLs');
          const foreign=urls.filter(u=>u!=='https://amphon.co.th'&&!u.startsWith('https://amphon.co.th/'));
          if(foreign.length)console.error('Foreign sitemap hosts:',foreign.slice(0,5));
          assert.equal(foreign.length,0,'Wrong sitemap hostname');
          assert.ok(!urls.some(u=>u.includes('cf-test.amphon.co.th')),'Staging leaked into sitemap');
          NODE
          node scripts/cloudflare-release-finalize.mjs
      - name: Dry-run only and local Cloudflare HTTP regression
        run: |
          npx wrangler deploy --config dist/server/wrangler.rc-audit.json --dry-run --outdir .cf-rc-dryrun
          node scripts/cloudflare-production-local-smoke.mjs
      - name: Verify production-only routing and indexability
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const headers=fs.readFileSync('dist/client/_headers','utf8');
          assert.doesNotMatch(headers,/^\s*X-Robots-Tag:[^\n]*noindex/im);
          const redirects=fs.readFileSync('dist/client/_redirects','utf8').split(/\r?\n/).filter(x=>x.startsWith('/'));
          assert.ok(redirects.length>=261);
          assert.equal(new Set(redirects.map(x=>x.split(/\s+/)[0])).size,redirects.length);
          const s=fs.readFileSync('dist/client/sitemap-index.xml','utf8');
          assert.match(s,/<sitemapindex/);
          console.log('Release route check passed:',redirects.length,'unique redirect rules; indexable HTML');
          NODE
      - name: Confirm no Vercel routing dependency was bundled into Cloudflare Worker
        run: |
          if grep -r -E -q --include='*.js' 'path-to-regexp|@vercel/routing-utils' dist/server; then
            echo 'NO-GO: Vercel-only routing dependency appears in Cloudflare runtime bundle'
            exit 1
          fi
          echo 'PASS: Cloudflare runtime bundle does not contain Vercel routing dependency signatures'
      - name: Capture isolated upgrade evidence (not deployed; do not publish secrets)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astro7-cloudflare-upgrade-eval-no-deploy
          path: |
            package.json
            package-lock.json
            scripts/cloudflare-lock-verify.mjs
            artifacts/cloudflare-migration/security-audit.json
            artifacts/cloudflare-migration/local-production-candidate-smoke.json
          if-no-files-found: warn
          retention-days: 14

  persist-reviewed-upgrade:
    name: Persist tested Astro7 dependency files on isolated branch (no deployment)
    needs: [security-upgrade-experiment, frozen-lock-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/infra/cloudflare-security-astro7-eval'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact tested source (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download passing workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: astro7-cloudflare-upgrade-eval-no-deploy
          path: .cloudflare-security-artifact
      - name: Inspect and stage only controlled dependency files
        run: |
          set -euo pipefail
          cp .cloudflare-security-artifact/package.json ./package.json
          cp .cloudflare-security-artifact/package-lock.json ./package-lock.json
          cp .cloudflare-security-artifact/scripts/cloudflare-lock-verify.mjs scripts/cloudflare-lock-verify.mjs
          git add package.json package-lock.json scripts/cloudflare-lock-verify.mjs
          git diff --cached --name-only
          git diff --cached --name-only | grep -Ev '^(package.json|package-lock.json|scripts/cloudflare-lock-verify.mjs)$' && exit 1 || true
          if git diff --cached --quiet; then echo "No dependency changes to commit"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(issue54): persist CI-tested patched Astro7 Cloudflare14 lockfile (no deploy)'
      - name: Push only this prepared candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin infra/cloudflare-security-astro7-eval
          if [ "$(git rev-parse FETCH_HEAD)" != "${GITHUB_SHA}" ]; then
            echo 'Branch moved since evaluation; refuse overwrite'
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]; then
            echo 'No new commit required'
            exit 0
          fi
          gh auth setup-git
          git push origin HEAD:refs/heads/infra/cloudflare-security-astro7-eval

  frozen-lock-verification:
    name: Verify committed lockfile and exact SHA from scratch (NO DEPLOY)
    needs: [security-upgrade-experiment]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact committed release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Require reproducible pinned and separated release dependencies
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(p.dependencies.astro,'7.4.9');
          assert.equal(p.dependencies['@astrojs/markdown-remark'],'7.3.6');
          assert.ok(!p.dependencies['@astrojs/vercel']);
          assert.equal(p.devDependencies['@astrojs/vercel'],'11.0.21');
          assert.equal(p.devDependencies['@astrojs/cloudflare'],'14.4.7');
          assert.equal(p.devDependencies.wrangler,'4.125.0');
          assert.equal(p.devDependencies.sharp,'0.35.5');
          assert.equal(l.packages[''].dependencies.astro,p.dependencies.astro);
          assert.equal(l.packages[''].devDependencies['@astrojs/cloudflare'],p.devDependencies['@astrojs/cloudflare']);
          console.log('PASS: exact pinned release versions at SHA',process.env.GITHUB_SHA);
          NODE
          npm ci --no-fund
          node scripts/cloudflare-lock-verify.mjs
      - name: Audit committed production lockfile with zero High and Critical
        run: |
          npm audit --omit=dev --json > /tmp/amphon-production-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const a=JSON.parse(fs.readFileSync('/tmp/amphon-production-audit.json','utf8'));
          const v=a.metadata?.vulnerabilities;
          assert.ok(v&&Number.isInteger(v.critical)&&Number.isInteger(v.high));
          assert.equal(v.critical,0);assert.equal(v.high,0);
          console.log('PASS: committed production audit',JSON.stringify(v));
          NODE
      - name: Build and test actual committed release only
        run: |
          npm run test:google-reviews
          npx astro build --config astro.config.cloudflare.production.mjs
          npm run validate:seo
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const root='dist/client';
          const xmls=fs.readdirSync(root).filter(f=>/^sitemap-\d+\.xml$/.test(f));
          assert.ok(xmls.length>0,'Missing generated sitemap pages');
          const urls=xmls.flatMap(f=>[...fs.readFileSync(root+'/'+f,'utf8').matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]));
          console.log('PROTECTED_SITEMAP_URL_COUNT',urls.length,'sitemap files',xmls.length);
          assert.equal(urls.length,1189,'Sitemap count changed from current live Vercel baseline');
          assert.equal(new Set(urls).size,1189,'Duplicate sitemap URLs');
          const foreign=urls.filter(u=>u!=='https://amphon.co.th'&&!u.startsWith('https://amphon.co.th/'));
          if(foreign.length)console.error('Foreign sitemap hosts:',foreign.slice(0,5));
          assert.equal(foreign.length,0,'Wrong sitemap hostname');
          assert.ok(!urls.some(u=>u.includes('cf-test.amphon.co.th')),'Staging leaked into sitemap');
          NODE
          node scripts/cloudflare-release-finalize.mjs
          npx wrangler deploy --config dist/server/wrangler.rc-audit.json --dry-run --outdir .cf-rc-locked-dryrun
          node scripts/cloudflare-production-local-smoke.mjs
      - name: Assert release doesn't accidentally ship Vercel routing
        run: |
          if grep -r -E -q --include='*.js' 'path-to-regexp|@vercel/routing-utils' dist/server; then exit 1; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const x=JSON.parse(fs.readFileSync('dist/server/wrangler.rc-audit.json','utf8'));
          assert.equal(x.name,'amphon-co-th-rc-audit');
          assert.ok(!x.routes&&!x.route);
          const h=fs.readFileSync('dist/client/_headers','utf8');
          assert.doesNotMatch(h,/^\s*X-Robots-Tag:[^\n]*noindex/im);
          console.log('PASS: committed SHA has no live domain route, global noindex or Vercel runtime dependency');
          NODE
