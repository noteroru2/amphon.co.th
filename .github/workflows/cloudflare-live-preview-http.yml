name: Cloudflare Live Preview HTTP QA
on:
  push:
    branches: [infra/cloudflare-workers-preview]
    paths:
      - 'scripts/cloudflare-live-preview-smoke.mjs'
      - '.github/workflows/cloudflare-live-preview-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-workers-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified preview branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check Live Workers.dev preview status, indexability, redirects and Google Reviews fallback
        run: node scripts/cloudflare-live-preview-smoke.mjs
      - name: Upload public HTTP result (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-live-preview-http-qa
          path: artifacts/cloudflare-migration/live-preview-http-qa.json
          retention-days: 30
          if-no-files-found: ignore
