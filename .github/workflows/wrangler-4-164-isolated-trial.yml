name: Isolated Wrangler 4.164.0 security compatibility trial (NO DEPLOY)
on:
  push:
    branches:
      - security/wrangler-4-164-trial-20261119
permissions:
  contents: write
jobs:
  trial:
    if: github.repository == 'noteroru2/amphon.co.th' && github.ref == 'refs/heads/security/wrangler-4-164-trial-20261119' && !contains(github.event.head_commit.message, '[wrangler-lock-regenerated]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout only isolated non-production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Astro7 pinned Node 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Generate real npm lockfile for Wrangler 4.164.0
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit --registry=https://registry.npmjs.org/
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(p.devDependencies.wrangler,'4.164.0');
          assert.equal(l.packages[''].devDependencies.wrangler,'4.164.0');
          assert.equal(l.packages['node_modules/wrangler'].version,'4.164.0');
          assert.equal(Object.keys(l.packages[''].dependencies||{}).length,0);
          assert.equal(l.packages['node_modules/picomatch'].version,'4.0.7');
          assert.equal(l.packages['node_modules/anymatch/node_modules/picomatch'].version,'2.3.2');
          console.log('WRANGLER_TRIAL_REAL_NPM_LOCK '+JSON.stringify({entries:Object.keys(l.packages).length,version:l.packages['node_modules/wrangler'].version}));
          NODE
      - name: Install and verify actual hardening and frozen core
        run: |
          npm ci --no-fund --registry=https://registry.npmjs.org/
          node scripts/cloudflare-lock-verify.mjs
          npm run qa:picomatch-hardening
      - name: Preserve the production gate and report full build security
        run: |
          mkdir -p artifacts/security
          npm audit --omit=dev --json > artifacts/security/wrangler-production-audit.json || true
          npm audit --json > artifacts/security/wrangler-full-audit.json || true
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const prod=JSON.parse(fs.readFileSync('artifacts/security/wrangler-production-audit.json','utf8'));
          const all=JSON.parse(fs.readFileSync('artifacts/security/wrangler-full-audit.json','utf8'));
          const v=prod.metadata?.vulnerabilities, w=all.metadata?.vulnerabilities;
          for(const x of [v,w])assert.ok(x&&Number.isInteger(x.high)&&Number.isInteger(x.critical),'npm audit unavailable');
          assert.equal(v.high,0);assert.equal(v.critical,0);assert.equal(w.critical,0);
          assert.ok(w.high<=23,'Full audit High regression from 23');
          assert.ok(w.moderate<=0,'Full audit Moderate regression from 0');
          console.log('WRANGLER_SECURITY_TRIAL '+JSON.stringify({production:v,full:w,remaining:Object.entries(all.vulnerabilities||{}).filter(([,x])=>x.severity==='high').map(([n])=>n)}));
          NODE
      - name: Real Astro7 Cloudflare build, SEO, routing and Worker dry-run
        run: |
          npm run test:google-reviews
          node --test scripts/cloudflare-routing.test.mjs scripts/cloudflare-release-finalize.test.mjs
          npm run qa:picomatch-hardening
          npx astro build --config astro.config.cloudflare.production.mjs
          npm run validate:seo
          node scripts/cloudflare-release-finalize.mjs
          node scripts/check-issue50-rendered-truth.mjs
          node scripts/audit-serviceareas-1020.mjs
          node scripts/check-issue50-gsc-regional.mjs
          node scripts/check-p0-parent-service-truth.mjs
          node scripts/check-local-parent-price-table-links.mjs
          npx wrangler deploy --config dist/server/wrangler.rc-audit.json --dry-run --outdir .cf-integration-dryrun
          node scripts/cloudflare-production-local-smoke.mjs
          node scripts/check-cloudflare-runtime-picomatch-exposure.mjs
      - name: Archive read-only security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrangler-4-164-isolated-security-check
          path: artifacts/security/wrangler-*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit only audited npm-generated lockfile if all tests pass
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/security/wrangler-4-164-trial-20261119'
          git diff --exit-code -- package.json scripts src .github/workflows
          git add -- package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): use tested Wrangler 4.164.0 lockfile [wrangler-lock-regenerated]"
          git push origin HEAD:refs/heads/security/wrangler-4-164-trial-20261119
