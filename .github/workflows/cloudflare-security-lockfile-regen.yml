name: Cloudflare Security Lockfile Regeneration (NO DEPLOY)

# This workflow generates a real npm lockfile as a downloadable GitHub artifact.
# It never pushes to a branch or deploys to Cloudflare/Production.
on:
  push:
    branches:
      - security/cloudflare-astro7-audit-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    if: github.repository == 'noteroru2/amphon.co.th' && github.ref == 'refs/heads/security/cloudflare-astro7-audit-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout security candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 22 exact same as Cloudflare QA
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Generate deterministic npm lockfile for exact approved direct pins
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(lock.lockfileVersion,3);
          for(const name of ['astro','@astrojs/markdown-remark']){
            assert.equal(lock.packages[''].dependencies[name],pkg.dependencies[name],'root '+name);
            assert.equal(lock.packages['node_modules/'+name].version,pkg.dependencies[name],'locked '+name);
          }
          const unintegrified=Object.entries(lock.packages).filter(([path,p])=>path&&p.resolved&&!p.integrity).map(([path])=>path);
          assert.equal(unintegrified.length,0,'Missing integrity hashes: '+unintegrified.slice(0,10));
          const keys=['astro','@astrojs/markdown-remark','@astrojs/vite-plugin-astro','@astrojs/markdown-satteri','vite','picomatch'];
          console.log('SECURITY_LOCKFILE_PACKAGE_VERSIONS '+JSON.stringify(keys.map(name=>({name,version:lock.packages['node_modules/'+name]?.version}))));
          console.log('LOCKFILE_PACKAGE_COUNT '+Object.keys(lock.packages).length);
          NODE
      - name: Validate generated lock can be installed from scratch
        run: npm ci --no-fund --registry=https://registry.npmjs.org/
      - name: Report production advisories with package chain (do not suppress)
        run: |
          npm audit --omit=dev --json > /tmp/amphon-audit-regenerated.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/amphon-audit-regenerated.json','utf8'));
          const packages=Object.entries(report.vulnerabilities??{}).filter(([,v])=>v.severity==='high'||v.severity==='critical').map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via??[]).map(a=>typeof a==='string'?a:{name:a.name,title:a.title,url:a.url,range:a.range,severity:a.severity})}));
          console.log('SECURITY_AUDIT_ADVISORIES '+JSON.stringify({totals:report.metadata?.vulnerabilities,packages}));
          NODE
      - name: Upload genuinely npm-generated lockfile for connector commit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-security-regenerated-package-lock
          path: package-lock.json
          retention-days: 7
          if-no-files-found: error
