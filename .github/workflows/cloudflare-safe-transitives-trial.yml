name: Try safe semver-only npm vulnerability remediation (NO DEPLOY, branch-only)
on:
  push:
    branches: ['security/cloudflare-safe-transitives-20261118']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trial:
    if: github.repository == 'noteroru2/amphon.co.th' && github.ref == 'refs/heads/security/cloudflare-safe-transitives-20261118' && !contains(github.event.head_commit.message, '[safe-npm-updated]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Isolated branch checkout only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Pinned Node 22.23.4 (Astro7)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Baseline locked install with real picomatch guard
        run: |
          npm ci --no-fund --registry=https://registry.npmjs.org/
          node scripts/cloudflare-lock-verify.mjs
          npm run qa:picomatch-hardening
      - name: Snapshot npm full-tree advisory report
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/full-audit-before.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const o=JSON.parse(fs.readFileSync('artifacts/security/full-audit-before.json','utf8'));
          console.log('BEFORE_SAFE_FIX '+JSON.stringify({totals:o.metadata?.vulnerabilities,findings:Object.entries(o.vulnerabilities??{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,isDirect:v.isDirect}))}));
          NODE
      - name: Trial npm audit fix within semver ranges ONLY — no --force
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund --registry=https://registry.npmjs.org/ || true
          git diff --stat -- package-lock.json
          git diff --exit-code -- package.json scripts src .github/workflows
      - name: Reinstall and harden from generated lockfile
        run: |
          npm ci --no-fund --registry=https://registry.npmjs.org/
          node scripts/cloudflare-lock-verify.mjs
          npm run qa:picomatch-hardening
      - name: Preserve strict production audit and full comparison
        run: |
          npm audit --omit=dev --json > artifacts/security/production-after.json || true
          npm audit --json > artifacts/security/full-audit-after.json || true
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('artifacts/security/full-audit-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('artifacts/security/full-audit-after.json','utf8'));
          const prod=JSON.parse(fs.readFileSync('artifacts/security/production-after.json','utf8'));
          const vb=before.metadata?.vulnerabilities,va=after.metadata?.vulnerabilities,vp=prod.metadata?.vulnerabilities;
          for(const v of [vb,va,vp]) assert.ok(v&&Number.isInteger(v.high)&&Number.isInteger(v.critical),'Audit unavailable');
          assert.equal(vp.high,0,'Runtime high vulnerability after update');
          assert.equal(vp.critical,0,'Runtime critical vulnerability after update');
          assert.equal(va.critical,0,'New full-tree critical advisory introduced');
          assert.ok(va.high<=vb.high,'Full-tree High count regressed');
          assert.ok(va.moderate<=vb.moderate,'Full-tree Moderate count regressed');
          const fixes=Object.entries(after.vulnerabilities||{}).filter(([,v])=>v.fixAvailable).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}));
          const report={before:vb,after:va,prod:vp,remainingFixable:fixes,safeImprovement:va.high<vb.high||va.moderate<vb.moderate};
          fs.writeFileSync('artifacts/security/safe-transitive-trial.json',JSON.stringify(report,null,2)+'\n');
          console.log('SAFE_NPM_TRIAL '+JSON.stringify(report));
          NODE
      - name: Full Astro7 Cloudflare validation — no deploy
        run: |
          npm run test:google-reviews
          node --test scripts/cloudflare-routing.test.mjs scripts/cloudflare-release-finalize.test.mjs
          npx astro build --config astro.config.cloudflare.production.mjs
          npm run validate:seo
          node scripts/cloudflare-release-finalize.mjs
          node scripts/check-issue50-rendered-truth.mjs
          node scripts/audit-serviceareas-1020.mjs
          npx wrangler deploy --config dist/server/wrangler.rc-audit.json --dry-run --outdir .cf-integration-dryrun
          node scripts/cloudflare-production-local-smoke.mjs
          node scripts/check-cloudflare-runtime-picomatch-exposure.mjs
      - name: Upload security before/after reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amphon-safe-npm-trial-security-comparison
          path: artifacts/security/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit ONLY genuine npm lockfile when full audit improves
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/security/cloudflare-safe-transitives-20261118'
          git diff --exit-code -- package.json scripts src .github/workflows
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('artifacts/security/safe-transitive-trial.json','utf8'));
          fs.writeFileSync('/tmp/amphon-safe-improved',String(Boolean(x.safeImprovement)));
          NODE
          if test "$(cat /tmp/amphon-safe-improved)" = true && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            test "$(git diff --cached --name-only)" = 'package-lock.json'
            git commit -m "fix(security): update semver-safe transitive locks [safe-npm-updated]"
            git push origin HEAD:refs/heads/security/cloudflare-safe-transitives-20261118
          else
            echo "NO_SAFE_LOCKFILE_IMPROVEMENT — no commit, keep original full audit findings"
          fi
