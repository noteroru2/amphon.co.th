name: AMPHON P11 Astro Redirect Fix Release QA (NO DEPLOY)
on:
  pull_request:
    branches:
      - release/cloudflare-unified-astro7-20261118
    paths:
      - 'scripts/cloudflare-routing.mjs'
      - 'scripts/cloudflare-routing.test.mjs'
      - 'scripts/cloudflare-production-local-smoke.mjs'
      - '.github/workflows/production-astro-redirect-fix-qa.yml'
permissions:
  contents: read
jobs:
  candidate-local-only:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Exact frozen original release plus reviewed source changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unrelated changes and unexpected baseline
        run: |
          git cat-file -e cb55117d641ea76cfa0e5d1cc9e55a8deb724caa^{commit}
          git diff --name-only cb55117d641ea76cfa0e5d1cc9e55a8deb724caa HEAD > /tmp/p11-change-files.txt
          cat /tmp/p11-change-files.txt
          if grep -Ev '^scripts/cloudflare-(routing\.mjs|routing\.test\.mjs|production-local-smoke\.mjs)$|^\.github/workflows/production-astro-redirect-fix-qa\.yml$' /tmp/p11-change-files.txt; then
            echo "FAIL: unrelated site source change in patch"
            exit 1
          fi
      - name: Node for exact Cloudflare Astro 7 release
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Lock, security and parser validation
        run: |
          npm ci --no-fund
          node scripts/cloudflare-lock-verify.mjs
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=moderate
          npm run qa:picomatch-hardening
      - name: Strict redirect, Google Reviews and bundle tests
        run: |
          node --test scripts/cloudflare-routing.test.mjs scripts/cloudflare-release-finalize.test.mjs
          npm run test:google-reviews
      - name: Build the exact Cloudflare production config WITHOUT uploading any Worker
        run: |
          npx astro build --config astro.config.cloudflare.production.mjs
          node scripts/cloudflare-release-finalize.mjs
          npm run validate:seo
          node scripts/check-issue50-rendered-truth.mjs
          node scripts/check-p0-parent-service-truth.mjs
          node scripts/check-issue50-gsc-regional.mjs
          test -z "$(git status --porcelain -- src/content/serviceAreas src/content/services)"
      - name: Test all 260 exact + dynamic + 2 Astro-only URLs against disposable local Worker
        run: |
          node scripts/cloudflare-production-local-smoke.mjs
          node -e 'const r=require("./artifacts/cloudflare-migration/local-production-candidate-smoke.json");if(r.failed.length||r.legacyRedirectParity.exactFailed||!r.legacyRedirectParity.dynamicPassed||r.generatedAstroRedirectParity.total!==2||r.generatedAstroRedirectParity.passed!==2)throw Error("Candidate local redirect parity not proven")'
      - name: Publish no-secret, no-deploy QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amphon-p11-astro-adapter-fix-local-qa
          path: |
            artifacts/cloudflare-migration/local-production-candidate-smoke.json
            dist/client/_redirects
          retention-days: 7
          if-no-files-found: warn
