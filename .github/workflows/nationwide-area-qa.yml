name: Nationwide area SEO - source and Astro build QA

on:
  pull_request:
    paths:
      - 'src/content/areas/**'
      - 'src/config/area-regions.ts'
      - 'src/components/ProvinceGrid.astro'
      - 'src/layouts/AreaLayout.astro'
      - 'src/lib/seo.ts'
      - 'src/pages/พื้นที่ให้บริการ.astro'
      - 'scripts/check-nationwide-area-hubs.mjs'
      - '.github/workflows/nationwide-area-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-build:
    name: Static guards and production Astro build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9e9 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22 and npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check provinces, regional grouping and internal links
        run: node scripts/check-nationwide-area-hubs.mjs
      - name: Build Astro pages
        run: npm run build
      - name: Validate generated SEO output
        run: npm run validate:seo
