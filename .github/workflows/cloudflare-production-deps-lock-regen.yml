name: Regenerate production-scope npm lockfile (temporary, NO DEPLOY)
on:
  push:
    branches:
      - security/cloudflare-build-prod-deps-separation-20261118
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-lock:
    if: github.repository == 'noteroru2/amphon.co.th' && github.ref == 'refs/heads/security/cloudflare-build-prod-deps-separation-20261118' && !contains(github.event.head_commit.message, '[lock-regenerated]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exclusively non-production security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Node 22.23.4, matching Cloudflare QA
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Regenerate authentic npm lockfile without executing build scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(Object.keys(pkg.dependencies||{}).length,0);
          assert.equal(Object.keys(l.packages[''].dependencies||{}).length,0);
          for(const n of ['astro','@astrojs/markdown-remark','@astrojs/sitemap','@fontsource/sarabun']){
            assert.equal(l.packages[''].devDependencies[n],pkg.devDependencies[n]);
          }
          for(const n of ['node_modules/picomatch','node_modules/anymatch/node_modules/picomatch']){
            assert.equal(l.packages[n].dev,true,'picomatch not truly dev-only '+n);
            assert.ok(l.packages[n].integrity?.startsWith('sha512-'));
          }
          console.log('REAL_NPM_LOCKFILE_BOUNDARY '+JSON.stringify({entries:Object.keys(l.packages).length,productionDependencies:Object.keys(l.packages[''].dependencies||{}),picomatchDev:true}));
          NODE
      - name: Prove fresh full install and parser patch before committing
        run: |
          npm ci --no-fund --registry=https://registry.npmjs.org/
          node scripts/cloudflare-lock-verify.mjs
          npm run qa:picomatch-hardening
      - name: Require actual npm production audit HIGH zero, CRITICAL zero
        run: |
          npm audit --omit=dev --json > /tmp/amphon-production-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const v=JSON.parse(fs.readFileSync('/tmp/amphon-production-audit.json','utf8')).metadata?.vulnerabilities;
          assert.ok(v && Number.isInteger(v.high) && Number.isInteger(v.critical),'missing npm audit data');
          assert.equal(v.high,0,'Production audit HIGH not zero');
          assert.equal(v.critical,0,'Production audit CRITICAL not zero');
          console.log('SCOPED_PRODUCTION_AUDIT_PASS '+JSON.stringify(v));
          NODE
      - name: Transparently report entire build plus runtime graph audit, not a pass
        run: |
          npm audit --json > /tmp/amphon-all-deps-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('/tmp/amphon-all-deps-audit.json','utf8'));
          console.log('FULL_DEPENDENCY_AUDIT_REMAINING_FINDINGS '+JSON.stringify({severity:d.metadata?.vulnerabilities,highNames:Object.entries(d.vulnerabilities??{}).filter(([,v])=>v.severity==='high'||v.severity==='critical').map(([k])=>k)}));
          NODE
      - name: Test real production-only npm install omits all glob matchers
        run: |
          npm ci --omit=dev --no-fund --registry=https://registry.npmjs.org/
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert.equal(fs.existsSync('node_modules/picomatch'),false);
          assert.equal(fs.existsSync('node_modules/anymatch/node_modules/picomatch'),false);
          console.log('PRODUCTION_ONLY_INSTALL_NO_PICOMATCH PASS');
          NODE
      - name: Commit only generated lockfile in isolated branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/security/cloudflare-build-prod-deps-separation-20261118"
          git diff --exit-code -- package.json scripts .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "LOCK_ALREADY_CORRECT"
          else
            test "$(git diff --cached --name-only)" = "package-lock.json"
            git commit -m "fix(security): lock build-only dependency scope [lock-regenerated]"
            git push origin HEAD:refs/heads/security/cloudflare-build-prod-deps-separation-20261118
          fi
