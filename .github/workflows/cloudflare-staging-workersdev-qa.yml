name: Cloudflare Staging Workers.dev LIVE SEO / HTTP Acceptance (READ ONLY)
on:
  push:
    branches: [infra/cloudflare-production-staging]
    paths:
      - 'scripts/cloudflare-staging-live-qa.mjs'
      - '.github/workflows/cloudflare-staging-workersdev-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-live-staging-no-dns-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Read exact staging branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Verify LIVE isolated workers.dev SSL, sitemap, 260 redirects, staging noindex, API fallback
        env:
          STAGING_HOST: amphon-co-th-staging.noteroru2.workers.dev
          STAGING_API_EXPECT_CONFIGURED: 'false'
        run: node scripts/cloudflare-staging-live-qa.mjs
      - name: Save public QA evidence (no secret values)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue54-staging-workersdev-real-http-qa
          path: artifacts/cloudflare-migration/live-staging-acceptance.json
          if-no-files-found: warn
          retention-days: 30
